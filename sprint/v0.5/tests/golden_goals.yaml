# Golden goals — the acceptance suite for v0.5.
#
# Each goal is real (no mocks) and exercises one or more sprint capabilities.
# Run via orchestration/run_golden_goals.py.
#
# Pass criteria are per-goal. Sprint passes only when all goals pass.

goals:
  # 1. Research goal — multi-source crawl + synthesis.
  # Exercises: ReAct executor, crawl4ai, deliverables, artifact registry.
  - name: research
    goal: >
      Crawl https://example.com and https://httpbin.org/html.
      Produce a 1-paragraph markdown summary of each, plus a 2-sentence
      meta-summary comparing the two. Save to outputs/golden-research.md.
    budget_usd: 0.30
    timeout_min: 5
    expect:
      verdict: APPROVE
      min_artifacts: 1
      max_cost_usd: 0.30
      max_wallclock_s: 300

  # 2. Build goal — sandbox-driven code + test.
  # Exercises: ReAct executor, sandbox session, persistent filesystem state.
  - name: build
    goal: >
      In a sandbox session: (1) write a Python file factorial.py with a
      recursive factorial function; (2) write test_factorial.py with three
      assertions including factorial(0)==1 and factorial(5)==120; (3) run
      the tests with pytest and confirm they pass. Both files must be
      written in the same sandbox session.
    budget_usd: 0.25
    timeout_min: 5
    expect:
      verdict: APPROVE
      max_cost_usd: 0.25
      max_wallclock_s: 300

  # 3. Multimedia goal — multiple media tools.
  # Exercises: image_gen OR tts (one available), slides, deliverables, lineage.
  - name: multimedia
    goal: >
      Produce a 3-slide markdown deck about "agent tool use," then convert
      it to PDF via the slides tool. Save the markdown and the PDF to outputs/.
      Cite the slides PDF artifact as derived from the markdown artifact.
    budget_usd: 0.20
    timeout_min: 5
    expect:
      verdict: APPROVE
      min_artifacts: 2
      max_cost_usd: 0.20
      max_wallclock_s: 300

  # 4. Login goal — stateful browser.
  # Exercises: browser session, multi-step flow with state.
  - name: login
    goal: >
      Open a single browser session and (1) navigate to
      https://httpbin.org/cookies/set?session_demo=v05; (2) in the SAME
      session, navigate to https://httpbin.org/cookies and extract the
      JSON; (3) confirm the response includes "session_demo": "v05".
      Return the extracted JSON as the final answer.
    budget_usd: 0.20
    timeout_min: 3
    expect:
      verdict: APPROVE
      max_cost_usd: 0.20
      max_wallclock_s: 180

  # 5. Resume goal — checkpoint + resume integration.
  # Special-cased by the runner: starts the goal, kills it mid-flight via
  # _inject_fault_at_step (test hook), then resumes from latest checkpoint.
  - name: resume
    goal: >
      Run a 6-step workflow that crawls 3 URLs (https://example.com,
      https://httpbin.org/html, https://httpbin.org/json), summarizes
      each, and emits a final combined markdown report saved to
      outputs/resume-test.md. The runner will inject a fault after step 3;
      a clean resume must complete the remaining steps and emit the report.
    budget_usd: 0.30
    timeout_min: 8
    expect:
      verdict: APPROVE
      min_artifacts: 1
      max_cost_usd: 0.30
      max_wallclock_s: 480

  # 6. Wide goal — sub-agent fanout.
  # Exercises: sub_agent tool, parallel execution, aggregate cost.
  - name: wide
    goal: >
      Use the sub_agent tool to research three topics in parallel:
      (1) "structured outputs in modern LLM APIs",
      (2) "what changed in Python 3.13 type system features",
      (3) "best practices for agent observability in 2026".
      Each sub-agent uses crawl4ai and deliverables only. After all
      three return, write a 500-word executive summary saved to
      outputs/golden-wide.md.
    budget_usd: 0.80
    timeout_min: 10
    expect:
      verdict: APPROVE
      min_artifacts: 1
      max_cost_usd: 0.80
      max_wallclock_s: 600

  # 7. Streaming goal — event ordering.
  # Special-cased by the runner: collects the event stream and asserts
  # that all expected event types appear and goal.completed is last.
  - name: streaming
    goal: >
      Crawl https://example.com, produce a 1-paragraph summary, save to
      outputs/streaming-test.md. While this runs the event stream is
      observed externally.
    budget_usd: 0.10
    timeout_min: 3
    expect:
      verdict: APPROVE
      min_artifacts: 1
      max_cost_usd: 0.10
      max_wallclock_s: 180
