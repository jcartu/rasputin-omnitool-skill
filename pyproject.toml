[project]
name = "rasputin_omnitool_skill"
version = "0.4.0"
description = "Rasputin Omnitool agent skill: planner / executor / reviewer loop with 12 tools across research, sandbox, browser, and multimedia"
requires-python = ">=3.11"
license = {text = "MIT"}
dependencies = [
    # rasputin_omnitool kernel must be installed separately:
    #   pip install -e ../rasputin-omnitool
    # The skill imports `rasputin_omnitool.catalog` and `rasputin_omnitool.deliverables`.
    "anthropic>=0.40",
    "openai>=1.50",
    "httpx>=0.27",
    "playwright>=1.50",
    "jsonschema>=4.20",
    "langfuse>=2.50",
]

[project.optional-dependencies]
# Aspirational integrations not yet wired into the runtime; install opt-in:
#   pip install -e ".[integrations]"
integrations = [
    "openclaw-skill-sdk>=2026.4.0",  # not yet on PyPI; install from source when needed
    "promptfoo>=0.100",
]

dev = ["pytest>=8.0", "pytest-asyncio>=0.23"]
voice = ["voxtral-tts>=0.5", "kokoro-onnx>=0.4"]
image = ["comfy-cli>=2.0"]

[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["."]
include = ["tools*", "agent*", "prompts*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
filterwarnings = [
    "ignore:The pynvml package is deprecated:FutureWarning",
]
